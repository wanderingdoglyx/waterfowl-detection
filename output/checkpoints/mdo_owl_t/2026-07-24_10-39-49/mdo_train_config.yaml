train:
  wandb_project: waterfowl-owl
  wandb_entity: anonymous
  wandb_run: 2026-07-24_10-39-49
  seed: 42
  device_name: cuda
  model:
    name: OWLT
    from_torchvision: false
    load_from: /home/zygfd/waterflow/rebuild/third_party/MegaDetector-Overhead/weights/OWL-T.pth
    partial_load: false
    resume_from: null
    kwargs:
      num_layers: 34
      pretrained_cnn: false
      down_ratio: 2
      head_conv: 64
    freeze: null
  losses:
    FocalLoss:
      print_name: focal_loss
      from_torch: false
      output_idx: 0
      target_idx: 0
      lambda_const: 1.0
      kwargs:
        reduction: mean
        normalize: false
  datasets:
    img_size:
    - 512
    - 512
    anno_type: point
    collate_fn: null
    class_def:
      1: bird
    train:
      name: FolderDataset
      csv_file: /home/zygfd/waterflow/rebuild/mdo_data/train/gt.csv
      root_dir: /home/zygfd/waterflow/rebuild/mdo_data/train/images
      sampler: null
      albu_transforms:
        Normalize:
          mean: &id001
          - 0.485
          - 0.456
          - 0.406
          std: &id002
          - 0.229
          - 0.224
          - 0.225
      end_transforms:
        FIDT:
          add_bg: false
          down_ratio: 2
    validate:
      name: FolderDataset
      csv_file: /home/zygfd/waterflow/rebuild/mdo_data/val/gt.csv
      root_dir: /home/zygfd/waterflow/rebuild/mdo_data/val/images
      albu_transforms:
        Normalize:
          mean: *id001
          std: *id002
      end_transforms:
        DownSample:
          down_ratio: 2
          anno_type: point
  training_settings:
    valid_freq: 1
    trainer: Trainer
    print_freq: 50
    batch_size: 8
    num_workers: 4
    pin_memory: true
    optimizer: adam
    lr: 0.0005
    weight_decay: 0.0005
    auto_lr:
      mode: max
      patience: 10
      threshold: 0.0001
      threshold_mode: rel
      cooldown: 10
      min_lr: 1.0e-05
      verbose: true
    warmup_iters: 100
    vizual_fn: null
    epochs: 100
    evaluator:
      name: HerdNet_Detection_Branch_Evaluator
      threshold: 10
      select_mode: max
      validate_on: f1_score
      kwargs:
        print_freq: 50
        lmds_kwargs:
          kernel_size:
          - 3
          - 3
          adapt_ts: 0.3
    stitcher:
      name: HerdNet_Detection_Branch_Stitcher
      kwargs:
        overlap: 160
        down_ratio: 2
        up: false
        reduction: mean
